<!DOCTYPE html>
<html>
    <head>
        <title>Introduce</title>
        <style>
            body {
                background-color: #55b0ff;
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .text-bar{
                height: 600px;
                width: 500px;
                background-color: #e600ff;
                border-radius: 20px;
                text-align: center;
                font-size: 30px;
                font-style: italic;
                font-weight: bold;
                overflow: hidden;
            }
            .top-strip{
                height: 50px;
                background-color: #ffffff;
                font-size: 16px;
                line-height: 1.2;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .content{
                height: 550px;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .homework-btn{
                padding: 15px 25px;
                font-size: 20px;
                font-style: italic;
                font-weight: bold;
                color: #ffffff;
                background-color: #ff7ad9;
                border: 3px solid #ffffff;
                border-radius: 15px;
                cursor: pointer;
            }
            .homework-btn:hover{
                background-color: #ffffff;
                color: #e600ff;
            }
        </style>
    </head>
    <body>
        <div class="text-bar">
            <div class="top-strip">
                <div>Introduce</div>
                <div>Hello, This is a page all made by Terrel(Me)</div>
            </div>
            <div class="content">
                <button class="homework-btn" onclick="window.open('https://terrel20170603-dev.github.io/homework/')">Check The Homework!(St. Louis)</button>
            </div>
        </div>
    </body>
</html>
